[project]
name = "application-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for the Application Tracker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.1,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3.0.0",
    "pytest>=8.4.1,<9.0.0",
    "ruff>=0.12.5,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
