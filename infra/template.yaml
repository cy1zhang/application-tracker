AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Application Tracker development environment

Parameters:
  BudgetEmail:
    Type: String
    Description: Address for monthly budget alerts
  GoogleOAuthSecretName:
    Type: String
    Description: Secrets Manager JSON secret with client_id and client_secret
  GmailOAuthSecretName:
    Type: String
    Description: Separate Secrets Manager JSON secret for Gmail consent
  ReserveConcurrency:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true only when the account has enough unreserved Lambda concurrency
  OpenAiModelId:
    Type: String
    Default: ''
    Description: OpenAI model ID; blank leaves the OpenAI provider unavailable
  AnthropicModelId:
    Type: String
    Default: ''
    Description: Anthropic model ID; blank leaves the Anthropic provider unavailable
  GeminiModelId:
    Type: String
    Default: ''
    Description: Gemini model ID; blank leaves the Gemini provider unavailable
  AlarmNotifications:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true to email alarm state changes to BudgetEmail through SNS

Conditions:
  UseReservedConcurrency: !Equals [!Ref ReserveConcurrency, 'true']
  SendAlarmEmail: !Equals [!Ref AlarmNotifications, 'true']

Resources:
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: application_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: application_id
          KeyType: RANGE

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: owner_application_id
          AttributeType: S
        - AttributeName: occurred_at_event_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: application-events-index
          KeySchema:
            - AttributeName: owner_application_id
              KeyType: HASH
            - AttributeName: occurred_at_event_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  OAuthStatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: state_hash
          AttributeType: S
      KeySchema:
        - AttributeName: state_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  SyncRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: run_id
          KeyType: RANGE

  SyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SyncDeadLetterQueue.Arn
        maxReceiveCount: 5

  SyncDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  AccountDeletionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AccountDeletionDeadLetterQueue.Arn
        maxReceiveCount: 5

  AccountDeletionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  GmailKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    Properties:
      Description: Encrypt Application Tracker Gmail refresh tokens
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAM
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  ApprovedUsersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: tracker-users
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        authorize_scopes: email profile openid
        client_id: !Sub '{{resolve:secretsmanager:${GoogleOAuthSecretName}:SecretString:client_id}}'
        client_secret: !Sub '{{resolve:secretsmanager:${GoogleOAuthSecretName}:SecretString:client_secret}}'
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub '${AWS::StackName}-frontend'
      Platform: WEB
      CustomRules:
        - Source: /<*>
          Target: /index.html
          Status: '404-200'

  AmplifyMainBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      EnableAutoBuild: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-browser'
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub 'https://main.${AmplifyApp.DefaultDomain}/'
      LogoutURLs:
        - !Sub 'https://main.${AmplifyApp.DefaultDomain}/'
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub 'app-tracker-dev-${AWS::AccountId}'
      ManagedLoginVersion: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: Application Tracker
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://main.${AmplifyApp.DefaultDomain}'
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [openid]
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../backend
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, 2, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          EVENTS_TABLE: !Ref EventsTable
          USERS_TABLE: !Ref UsersTable
          OAUTH_STATES_TABLE: !Ref OAuthStatesTable
          SYNC_RUNS_TABLE: !Ref SyncRunsTable
          SYNC_QUEUE_URL: !Ref SyncQueue
          DELETION_QUEUE_URL: !Ref AccountDeletionQueue
          COGNITO_USER_POOL_ID: !Ref UserPool
          GMAIL_KMS_KEY_ARN: !GetAtt GmailKmsKey.Arn
          GMAIL_OAUTH_SECRET_NAME: !Ref GmailOAuthSecretName
          FRONTEND_URL: !Sub 'https://main.${AmplifyApp.DefaultDomain}'
          AI_MODEL_OPENAI: !Ref OpenAiModelId
          AI_MODEL_ANTHROPIC: !Ref AnthropicModelId
          AI_MODEL_GEMINI: !Ref GeminiModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt ApplicationsTable.Arn
                - !GetAtt EventsTable.Arn
                - !Sub '${EventsTable.Arn}/index/application-events-index'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt SyncRunsTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SyncQueue.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AccountDeletionQueue.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt OAuthStatesTable.Arn
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !GetAtt GmailKmsKey.Arn
              Condition:
                StringEquals:
                  'kms:EncryptionContext:credential_type': gmail_refresh_token
            - Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !GetAtt GmailKmsKey.Arn
              Condition:
                StringEquals:
                  'kms:EncryptionContext:credential_type': ai_api_key
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GmailOAuthSecretName}-*'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        GmailCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /oauth/google/callback
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        ApplicationRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14

  SyncWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-sync-worker'
      CodeUri: ../backend
      Handler: app.sync_handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 600
      MemorySize: 256
      Environment:
        Variables:
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          EVENTS_TABLE: !Ref EventsTable
          USERS_TABLE: !Ref UsersTable
          OAUTH_STATES_TABLE: !Ref OAuthStatesTable
          SYNC_RUNS_TABLE: !Ref SyncRunsTable
          SYNC_QUEUE_URL: !Ref SyncQueue
          GMAIL_KMS_KEY_ARN: !GetAtt GmailKmsKey.Arn
          GMAIL_OAUTH_SECRET_NAME: !Ref GmailOAuthSecretName
          AI_MODEL_OPENAI: !Ref OpenAiModelId
          AI_MODEL_ANTHROPIC: !Ref AnthropicModelId
          AI_MODEL_GEMINI: !Ref GeminiModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem]
              Resource:
                - !GetAtt ApplicationsTable.Arn
                - !GetAtt EventsTable.Arn
                - !Sub '${EventsTable.Arn}/index/application-events-index'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt SyncRunsTable.Arn
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:SendMessage]
              Resource: !GetAtt SyncQueue.Arn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt GmailKmsKey.Arn
              Condition:
                StringEquals:
                  'kms:EncryptionContext:credential_type': gmail_refresh_token
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt GmailKmsKey.Arn
              Condition:
                StringEquals:
                  'kms:EncryptionContext:credential_type': ai_api_key
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GmailOAuthSecretName}-*'
      Events:
        SyncJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt SyncQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  SyncWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SyncWorkerFunction}'
      RetentionInDays: 14

  SyncDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-sync-dispatcher'
      CodeUri: ../backend
      Handler: app.dispatch_handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SYNC_RUNS_TABLE: !Ref SyncRunsTable
          SYNC_QUEUE_URL: !Ref SyncQueue
          DELETION_QUEUE_URL: !Ref AccountDeletionQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt SyncRunsTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SyncQueue.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AccountDeletionQueue.Arn
      Events:
        DailySync:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: 'cron(0 9 * * ? *)'
            ScheduleExpressionTimezone: UTC
            FlexibleTimeWindow:
              Mode: 'OFF'
            Input: '{"mode":"daily"}'
        RecoverSync:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: 'rate(15 minutes)'
            FlexibleTimeWindow:
              Mode: 'OFF'
            Input: '{"mode":"recover"}'

  SyncDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SyncDispatcherFunction}'
      RetentionInDays: 14

  SyncDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sync jobs exhausted SQS retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SyncDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  AccountDeletionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-account-deletion'
      CodeUri: ../backend
      Handler: app.deletion_handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          EVENTS_TABLE: !Ref EventsTable
          SYNC_RUNS_TABLE: !Ref SyncRunsTable
          OAUTH_STATES_TABLE: !Ref OAuthStatesTable
          GMAIL_KMS_KEY_ARN: !GetAtt GmailKmsKey.Arn
          USER_POOL_ID: !Ref UserPool
          DELETION_QUEUE_URL: !Ref AccountDeletionQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem, dynamodb:DeleteItem]
              Resource: !GetAtt ApplicationsTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem, dynamodb:DeleteItem]
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem]
              Resource: !GetAtt SyncRunsTable.Arn
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt OAuthStatesTable.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:PutItem]
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt GmailKmsKey.Arn
              Condition:
                StringEquals:
                  'kms:EncryptionContext:credential_type': gmail_refresh_token
            - Effect: Allow
              Action: cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:SendMessage]
              Resource: !GetAtt AccountDeletionQueue.Arn
      Events:
        DeletionJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt AccountDeletionQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  AccountDeletionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AccountDeletionFunction}'
      RetentionInDays: 14

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: SendAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref BudgetEmail

  AccountDeletionDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Account deletion jobs exhausted SQS retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AccountDeletionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  SyncWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sync worker invocation raised an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  SyncDispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sync dispatcher invocation raised an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncDispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  AccountDeletionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Account deletion invocation raised an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AccountDeletionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  SyncWorkerFailureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SyncWorkerLogGroup
      FilterPattern: '"event=sync_worker_failure"'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Operations'
          MetricName: SyncWorkerFailures
          MetricValue: '1'
          DefaultValue: 0

  SyncWorkerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Repeated sync worker failures in 15 minutes
      Namespace: !Sub '${AWS::StackName}/Operations'
      MetricName: SyncWorkerFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  SyncRunFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SyncWorkerLogGroup
      FilterPattern: '"event=sync_run_failed"'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Operations'
          MetricName: SyncRunsFailed
          MetricValue: '1'
          DefaultValue: 0

  SyncRunFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Repeated failed sync runs in 15 minutes
      Namespace: !Sub '${AWS::StackName}/Operations'
      MetricName: SyncRunsFailed
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  ApiUnhandledErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '"event=api_unhandled_error"'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Operations'
          MetricName: ApiUnhandledErrors
          MetricValue: '1'
          DefaultValue: 0

  ApiUnhandledErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Repeated unhandled API errors in 15 minutes
      Namespace: !Sub '${AWS::StackName}/Operations'
      MetricName: ApiUnhandledErrors
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  AccountDeletionFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AccountDeletionLogGroup
      FilterPattern: '"event=deletion_job_failed"'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Operations'
          MetricName: AccountDeletionFailures
          MetricValue: '1'
          DefaultValue: 0

  AccountDeletionFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An account deletion job failed
      Namespace: !Sub '${AWS::StackName}/Operations'
      MetricName: AccountDeletionFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  AccountDeletionEnqueueFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '"event=deletion_enqueue_failed"'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Operations'
          MetricName: AccountDeletionEnqueueFailures
          MetricValue: '1'
          DefaultValue: 0

  AccountDeletionEnqueueFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API could not queue an account deletion job
      Namespace: !Sub '${AWS::StackName}/Operations'
      MetricName: AccountDeletionEnqueueFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [SendAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
        CostTypes:
          IncludeCredit: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CognitoAuthority:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
  AmplifyUrl:
    Value: !Sub 'https://main.${AmplifyApp.DefaultDomain}'
